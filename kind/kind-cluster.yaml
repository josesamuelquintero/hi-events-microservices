# kind config: maps the gateway's NodePort (30080) to localhost:8080 on the host,
# since kind clusters aren't reachable from outside docker without this.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
