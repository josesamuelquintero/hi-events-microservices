apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: hievents
data:
  init-db.sql: |
    CREATE DATABASE eventdb;
    CREATE DATABASE productdb;
    CREATE DATABASE orderdb;
    CREATE DATABASE paymentdb;
    CREATE DATABASE attendeedb;
    CREATE DATABASE promodb;
    CREATE DATABASE notifdb;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hievents
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: hievents-secrets, key: PGUSER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: hievents-secrets, key: PGPASSWORD } } }
            - { name: POSTGRES_DB, value: postgres }
          volumeMounts:
            - { name: init-script, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "hievents"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: init-script, configMap: { name: postgres-init } }
        # ponytail: emptyDir loses data on pod restart — fine for a course demo.
        # Swap for a PVC (or RDS on EKS) before this holds anything real.
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hievents
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
