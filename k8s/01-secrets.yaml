# ponytail: plain Secret manifest for a course demo. Values below are literal (not
# base64-hidden anything sensitive) — for a real deployment, generate this with
# `kubectl create secret ... --dry-run=client -o yaml` or use External Secrets /
# AWS Secrets Manager instead of committing values to git.
apiVersion: v1
kind: Secret
metadata:
  name: hievents-secrets
  namespace: hievents
type: Opaque
stringData:
  PGUSER: hievents
  PGPASSWORD: hievents
